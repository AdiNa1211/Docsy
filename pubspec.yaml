name: docsy
description: "Desktop document and image editor for Windows, macOS and Linux."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  image: ^4.5.4
  file_picker: ^10.3.3
  desktop_drop: ^0.5.0
  pdfrx: ^2.6.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
